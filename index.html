<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART TRADE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

header{
  background:#0b1728;
  border-bottom:1px solid #263b55;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.top{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#19e68c;
}

.balance{
  font-size:14px;
  color:#b9c7d8;
}

nav{
  max-width:1200px;
  margin:12px auto 0;
  display:flex;
  gap:7px;
  overflow-x:auto;
}

nav button{
  border:0;
  background:#14243a;
  color:#d9e4f2;
  padding:10px 14px;
  border-radius:8px;
  white-space:nowrap;
  cursor:pointer;
}

nav button.active,
nav button:hover{
  background:#19e68c;
  color:#06120e;
}

main{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

.page{display:none}
.page.active{display:block}

h1{
  margin-top:5px;
  font-size:25px;
}

h2{
  font-size:18px;
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.grid2{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:14px;
}

.card{
  background:#0d1b2e;
  border:1px solid #243a55;
  border-radius:14px;
  padding:16px;
  margin-bottom:15px;
}

.stat{
  font-size:23px;
  font-weight:bold;
  margin-top:8px;
}

.label{
  color:#8fa3ba;
  font-size:13px;
}

.green{color:#19e68c}
.red{color:#ff5570}
.yellow{color:#ffd166}

.watch{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stock{
  background:#101f34;
  border:1px solid #263e5b;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
}

.stock:hover{
  border-color:#19e68c;
}

.stock-name{
  font-weight:bold;
}

.price{
  margin-top:5px;
  font-size:17px;
}

.change{
  font-size:13px;
  margin-top:4px;
}

.fake-chart{
  height:240px;
  position:relative;
  overflow:hidden;
  border-radius:10px;
  background:
    linear-gradient(#19314a 1px,transparent 1px),
    linear-gradient(90deg,#19314a 1px,transparent 1px);
  background-size:40px 40px;
}

.chart-line{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:100%;
}

svg{
  width:100%;
  height:100%;
}

input,select{
  width:100%;
  padding:12px;
  margin:7px 0 13px;
  background:#091728;
  color:white;
  border:1px solid #304a68;
  border-radius:8px;
  outline:none;
}

input:focus,select:focus{
  border-color:#19e68c;
}

.btn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

.buy{
  background:#19e68c;
  color:#06120e;
}

.sell{
  background:#ff5570;
  color:white;
}

.secondary{
  background:#243852;
  color:white;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

.table-wrap{
  overflow-x:auto;
}

th,td{
  padding:12px 8px;
  border-bottom:1px solid #233850;
  text-align:left;
  font-size:14px;
}

th{
  color:#8fa3ba;
}

.message{
  padding:11px;
  border-radius:8px;
  background:#102d25;
  color:#19e68c;
  margin-bottom:12px;
  display:none;
}

.warning{
  background:#352b13;
  color:#ffd166;
}

.big-price{
  font-size:30px;
  font-weight:bold;
}

footer{
  text-align:center;
  color:#71859c;
  padding:25px;
  font-size:12px;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .grid2{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  main{padding:12px}

  .grid{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .card{padding:13px}

  .stat{font-size:18px}

  .watch{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">SMART TRADE</div>
    <div class="balance">
      Virtual Balance: ₹<span id="topBalance">100000</span>
    </div>
  </div>

  <nav>
    <button class="active" onclick="showPage('dashboard',this)">Dashboard</button>
    <button onclick="showPage('markets',this)">Markets</button>
    <button onclick="showPage('trade',this)">Trade</button>
    <button onclick="showPage('portfolio',this)">Portfolio</button>
    <button onclick="showPage('orders',this)">Orders</button>
    <button onclick="showPage('funds',this)">Funds</button>
    <button onclick="showPage('risk',this)">Risk</button>
  </nav>
</header>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">

<h1>Trading Dashboard</h1>

<div class="grid">

<div class="card">
<div class="label">Virtual Balance</div>
<div class="stat">₹<span id="dashBalance">100000</span></div>
</div>

<div class="card">
<div class="label">Portfolio Value</div>
<div class="stat">₹<span id="dashPortfolio">0</span></div>
</div>

<div class="card">
<div class="label">Total P/L</div>
<div class="stat" id="dashPL">₹0</div>
</div>

<div class="card">
<div
